spring.application.name=ms-auth
server.port=9091

# MySQL en el equipo. DB_HOST/DB_USER/DB_PASSWORD las entrega docker-compose; sin Docker se usan estos valores.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/mpaz_auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Vigencia del token en horas (propuesta del contrato: 24)
mpaz.jwt.horas=24
# PIN de los usuarios ficticios de prueba
mpaz.seed.pin=1234
