spring.application.name=ms-actividades-evaluaciones
server.port=9093

# MySQL en el equipo. DB_HOST/DB_USER/DB_PASSWORD las entrega docker-compose; sin Docker se usan estos valores.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/mpaz_actividades?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
