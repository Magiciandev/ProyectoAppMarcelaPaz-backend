spring.application.name=ms-admin
server.port=9095

# MySQL en el equipo. DB_HOST/DB_USER/DB_PASSWORD las entrega docker-compose; sin Docker se usan estos valores.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/mpaz_admin?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Direcciones DIRECTAS de los servicios (no pasan por el gateway: las rutas /interno/ no se exponen afuera).
# docker-compose las sobreescribe con los nombres de los contenedores.
mpaz.servicios.contenidos.url=${CONTENIDOS_URL:http://localhost:9092}
mpaz.servicios.evaluaciones.url=${EVALUACIONES_URL:http://localhost:9093}
