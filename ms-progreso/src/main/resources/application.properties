spring.application.name=ms-progreso
server.port=9094

# MySQL en el equipo. DB_HOST/DB_USER/DB_PASSWORD las entrega docker-compose; sin Docker se usan estos valores.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/mpaz_progreso?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Las fechas de calendario (asignaciones, ventanas de la prueba) se interpretan en esta zona horaria.
mpaz.zona-horaria=America/Santiago

# Dirección DIRECTA de ms-contenidos (no pasa por el gateway). docker-compose la sobreescribe.
mpaz.servicios.contenidos.url=${CONTENIDOS_URL:http://localhost:9092}
